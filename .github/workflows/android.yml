# Сборка Android-оболочки (Capacitor) при каждом пуше в main: debug-APK кладётся в релиз
# `android-latest` — постоянная ссылка для установки на телефон без Play Store:
#   https://github.com/14romrom/football-decision/releases/download/android-latest/football-decision-debug.apk
# Локально JDK и Android SDK не нужны: собирает раннер. versionCode = номер прогона, чтобы
# новая сборка ставилась поверх старой без удаления (сохраняется localStorage с карьерой).
name: android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # Android SDK уже стоит на ubuntu-latest (ANDROID_HOME, лицензии приняты); недостающие
      # платформы Gradle докачивает сам. setup-android@v3 падал на Node 24 — не нужен.
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME/platforms"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: version from run number and commit
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.${{ github.run_number }}+$(git rev-parse --short HEAD)\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      # Логи прогона без входа в GitHub не видны — ошибка Gradle дублируется в Summary прогона.
      - name: gradle assembleDebug
        shell: bash {0}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon) > build.log 2>&1; status=$?
          tail -40 build.log
          if [ "$status" -ne 0 ]; then { echo '### Gradle failed'; echo '```'; grep -n -i "error\|what went wrong\|FAILURE" -A6 build.log | tail -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk football-decision-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: football-decision-debug, path: football-decision-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android debug build
          prerelease: true
          body: "Остання debug-збірка з main. Встановлення: дозволити «невідомі джерела», відкрити APK. Версія — у налаштуваннях застосунку."
          files: football-decision-debug.apk
